# Studio only (default): web UI + API + coordinator. No GPU, no engines, no runner, no model weights.
#   docker compose up -d            -> UI/REST on http://127.0.0.1:${STUDIO_PORT:-8190} (loopback, no operator auth)
# GPU runners (separate machines) connect to Studio, see compose.node-remote.yml.
# All-in-one GPU box: compose.gpu-local.yml (+ compose.nodes.yml). TLS/proxy/auth for real deployments: out of repo.
# Image: `docker compose build` (this repo) or a registry copy via ASSETSTUDIO_IMAGE.
# Needs Docker Compose >= 2.24.4 (the overlay files use `!reset`/`!override`). Not for podman-compose.
# Ports are published on loopback by default. The UI has no login in this mode (STUDIO_AUTH_MODE=local): never bind it
# to a reachable address; put an authenticating proxy in front (STUDIO_AUTH_MODE=proxy) outside this repo.

name: assetstudio-studio

services:
  studio:
    build: {context: ., dockerfile: services/studio/Dockerfile}
    image: ${ASSETSTUDIO_IMAGE:-localhost/assetstudio-studio:dev}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${STUDIO_PORT:-8190}:8190"              # UI + REST: loopback only (no auth)
      - "${MCP_BIND:-127.0.0.1}:${MCP_PORT:-8191}:8191"     # MCP for agents: bearer tokens
      # Godot integration API (disabled unless STUDIO_INTEGRATION_ENABLED=1): library-scoped bearer tokens.
      - "${INTEGRATION_BIND:-127.0.0.1}:${INTEGRATION_PORT:-8192}:8192"
    environment:
      STUDIO_EXECUTION: nodes
      STUDIO_PUBLIC_URL: ${STUDIO_PUBLIC_URL:-http://studio:8190}   # audience runners sign; set to the URL runners use
      STUDIO_MCP: ${STUDIO_MCP:-1}
      STUDIO_MCP_PUBLIC_URL: ${STUDIO_MCP_PUBLIC_URL:-}
      STUDIO_INTEGRATION_ENABLED: ${STUDIO_INTEGRATION_ENABLED:-0}
      STUDIO_INTEGRATION_ALLOW_INSECURE_LAN: ${STUDIO_INTEGRATION_ALLOW_INSECURE_LAN:-0}
      COMFY_URL: ""                            # Studio never talks to engines in node mode
      AUX_URL: ""
      WORKER3D_URL: ""
    volumes:
      - ${PROJECTS_DIR:-./projects}:/projects
      - studio-instance:/data/instance         # journal, index, staging: machine-local state
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8190/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [internal, public]

volumes:
  studio-instance: {}

networks:
  internal: {internal: true}
  public: {}      # published ports need a non-internal network
